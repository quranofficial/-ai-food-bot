name: AI Food Super Pro

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: ai-food-super-pro
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check required secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import os
          if not os.getenv("BOT_TOKEN"):
              raise SystemExit("Missing GitHub Secret: BOT_TOKEN")
          if not os.getenv("GEMINI_API_KEY") and not os.getenv("GROQ_API_KEY"):
              raise SystemExit("Add at least one of GEMINI_API_KEY or GROQ_API_KEY in GitHub Secrets.")
          print("Telegram token and at least one AI key are configured.")
          PY

      - name: Run bot for a limited time
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: qwen/qwen3.8-27b
          GEMINI_MODEL: gemini-3.8-flash
          PYTHONUNBUFFERED: "1"
        run: |
          set -eu
          python bot.py &
          BOT_PID=$!
          cleanup() {
            kill "$BOT_PID" 2>/dev/null || true
            wait "$BOT_PID" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM
          sleep 20400
          cleanup
          trap - EXIT INT TERM
