
name: AI Food Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: ai-food-telegram-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          missing = [
              name for name in ("BOT_TOKEN", "GEMINI_API_KEY")
              if not os.getenv(name)
          ]
          if missing:
              raise SystemExit(
                  "Missing GitHub Secrets: " + ", ".join(missing)
              )
          print("Required secrets are configured.")
          PY

      - name: Run bot for a limited time
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          PYTHONUNBUFFERED: "1"
        run: |
          set -eu
          python bot.py &
          BOT_PID=$!

          cleanup() {
            kill "$BOT_PID" 2>/dev/null || true
            wait "$BOT_PID" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          sleep 20400
          cleanup
          trap - EXIT INT TERM
